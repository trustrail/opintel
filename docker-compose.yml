services:
  postgres:
    extends: {file: deploy/images/upstream.json, service: postgres}
    platform: ${PLATFORM:-linux/amd64}
    environment:
      POSTGRES_USER: opintel
      POSTGRES_PASSWORD: opintel
      POSTGRES_DB: opintel
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opintel"]
      interval: 5s
      retries: 10

  redis:
    extends: {file: deploy/images/upstream.json, service: redis}
    platform: ${PLATFORM:-linux/amd64}
    command: redis-server --save "" --appendonly no
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  spicedb-postgres:
    extends: {file: deploy/images/upstream.json, service: postgres}
    platform: ${PLATFORM:-linux/amd64}
    environment:
      POSTGRES_USER: spicedb
      POSTGRES_PASSWORD: spicedb
      POSTGRES_DB: spicedb
    volumes: ["spicedb-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spicedb"]
      interval: 5s
      retries: 10

  spicedb-migrate:
    extends: {file: deploy/images/upstream.json, service: spicedb}
    platform: ${PLATFORM:-linux/amd64}
    command: migrate head --datastore-engine postgres --datastore-conn-uri postgres://spicedb:spicedb@spicedb-postgres:5432/spicedb?sslmode=disable
    depends_on:
      spicedb-postgres:
        condition: service_healthy

  spicedb:
    extends: {file: deploy/images/upstream.json, service: spicedb}
    platform: ${PLATFORM:-linux/amd64}
    command: serve --grpc-preshared-key devkey --datastore-engine postgres --datastore-conn-uri postgres://spicedb:spicedb@spicedb-postgres:5432/spicedb?sslmode=disable
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully
    ports: ["${SPICEDB_PORT:-50051}:50051"]

volumes:
  spicedb-data:
