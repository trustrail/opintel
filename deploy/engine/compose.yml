# Set ENGINE_* variables in an operator-owned env file. Never bake secrets.
services:
  egress:
    image: ${IMAGE_PREFIX:-opintel}-egress:${TAG:?set image revision}
    platform: ${PLATFORM:-linux/amd64}
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${ENGINE_POLICY_FILE:?declare sources and receipt}:/policy/egress.json:ro
    healthcheck:
      test: [CMD, node, -e, "require('node:fs').accessSync('/run/egress-ready')"]
      interval: 1s
      retries: 60
    ports:
      - ${ENGINE_BIND_ADDRESS:-127.0.0.1}:${ENGINE_PORT:-3100}:3100
  engine:
    image: ${IMAGE_PREFIX:-opintel}-engine:${TAG:?set image revision}
    platform: ${PLATFORM:-linux/amd64}
    depends_on:
      egress:
        condition: service_healthy
    network_mode: service:egress
    extends:
      file: runtime.compose.yml
      service: engine
    volumes:
      - ${XQ_DIRECTORY:-${HOME}/.xq}:/xq:ro
      - ${ENGINE_CONFIG_DIRECTORY:?provision config and certificates}:/config:ro
      - ${ENGINE_AUDIT_DIRECTORY:?customer-owned audit}:/audit
      - ${ENGINE_CUSTODY_DIRECTORY:?customer-owned custody}:/custody
    environment:
      SIDECAR_CONFIG_FILE: /config/service.json
      UV_USE_IO_URING: "0"
    env_file:
      - ${ENGINE_SECRET_ENV_FILE:?operator-provisioned secret references}
    # The Engine supervisor owns the bounded restart budget. Docker must not
    # reset that budget indefinitely after terminal exhaustion.
    restart: "no"
