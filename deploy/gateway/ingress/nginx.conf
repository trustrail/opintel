user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server {
    listen 8443 ssl;
    ssl_certificate /tls/console.pem;
    ssl_certificate_key /tls/console.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $api http://api:3000;
    set $console http://console:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 0;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 90s;
    location = /healthz { proxy_pass $api; }
    location ~ ^/(api|mcp)(/|$) { proxy_pass $api; }
    location ~ ^/auth/oidc(/|$) { proxy_pass $api; }
    location / { proxy_pass $console; }
  }
}
