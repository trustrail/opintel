apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SidecarToolbox
metadata:
  name: opintel
spec:
  name: opintel
  version: "1"
  intent: Query governed data and redeem custody grants.
  source:
    image: ghcr.io/trustrail/opintel-companion@sha256:2f3cc453765f03a0301c7cd51bc7a83592f89c150f2246f204c4fb2ebbe53d13
  sandbox:
    class: opintel-companion
  transport:
    port: 8080
    path: /mcp
    healthcheck:
      path: /healthz
      timeoutSeconds: 30
  upstreamAuth:
    provider: opintel-agent
    envVar: OPINTEL_AGENT_CREDENTIAL
  config: '{"gateway":"https://opintel.trustrail.io","project":"8b0998f1-09c5-47ba-b060-1ee4920ba68b","agentId":"oap-analyst","caFile":null}'
  tools:
    - name: opintel_describe
      intent: List visible tables and their column treatments.
      permission:
        stateImpact: readonly
      args:
        allowedFields: []
    - name: opintel_query
      intent: Execute a governed SQL query.
      permission:
        stateImpact: readonly
      args:
        allowedFields: [sql]
    - name: opintel_unseal
      intent: Redeem and unseal an earlier custody result.
      # One-time redemption mutates the gateway grant, although data is only read.
      permission:
        stateImpact: readwrite
      args:
        allowedFields: [evidenceId, grantId]
