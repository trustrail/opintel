apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SidecarToolbox
metadata:
  name: opintel
spec:
  name: opintel
  version: "1"
  intent: Query governed data and redeem custody grants.
  source:
    image: ghcr.io/trustrail/opintel-companion@sha256:cfbd8b476e141927b965646b9ce3e47135909b938b5918b8b9e32cbacc0cd733
  sandbox:
    class: opintel-companion
  transport:
    port: 8080
    path: /mcp
    healthcheck:
      path: /healthz
      timeoutSeconds: 30
  upstreamAuth:
    provider: opintel-agent
    envVar: OPINTEL_AGENT_CREDENTIAL
  config: '{"gateway":"https://opintel.trustrail.io","project":"8b0998f1-09c5-47ba-b060-1ee4920ba68b","agentId":"oap-analyst","caFile":null}'
  tools:
    - name: opintel_describe
      intent: List visible tables and their column treatments.
      args:
        allowedFields: []
    - name: opintel_query
      intent: Execute a governed SQL query.
      args:
        allowedFields: [sql]
    - name: opintel_unseal
      intent: Redeem and unseal an earlier custody result.
      args:
        allowedFields: [evidenceId, grantId]
