name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: "! rg --fixed-strings '/dev/kitchen-sink' dist"
      - run: npx playwright install --with-deps chrome
      - run: npm run test:visual

  migrations:
    name: Migrations
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: postgresql://opintel:opintel@localhost:5432/opintel
      TEST_DATABASE_URL: postgresql://opintel:opintel@localhost:5432/opintel_test
      REDIS_URL: redis://localhost:6379
      REQUIRE_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: docker compose up -d --wait
      - run: docker compose exec -T postgres createdb -U opintel opintel_test
      - run: DATABASE_URL="$TEST_DATABASE_URL" npm run migrate:up
      - run: npm test
      - run: DATABASE_URL="$TEST_DATABASE_URL" npm run migrate:down
      - run: DATABASE_URL="$TEST_DATABASE_URL" npm run migrate:up
      - run: docker compose down -v
        if: always()
