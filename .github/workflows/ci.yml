name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://opintel:opintel@localhost:5432/opintel
      MIGRATION_DATABASE_URL: postgresql://opintel:opintel@localhost:5432/opintel
      TEST_DATABASE_URL: postgresql://opintel:opintel@localhost:5432/opintel_test
      REDIS_URL: redis://localhost:6379
      SPICEDB_ENDPOINT: localhost:50051
      SPICEDB_TOKEN: devkey
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run dev:up
      - run: npm run sidecar:prepare-scanner
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-record
          path: test-results/

  migrations:
    name: Migrations
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://opintel:opintel@localhost:5432/opintel
      MIGRATION_DATABASE_URL: postgresql://opintel:opintel@localhost:5432/opintel
      TEST_DATABASE_URL: postgresql://opintel:opintel@localhost:5432/opintel_test
      REDIS_URL: redis://localhost:6379
      SPICEDB_ENDPOINT: localhost:50051
      SPICEDB_TOKEN: devkey
      REQUIRE_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run sidecar:prepare-scanner
      - run: npm run dev:up
      - name: Bypass regression gate and open-attack queue
        if: ${{ !cancelled() }}
        run: npm run test:bypass
      # Separate process: no functional test workers compete with E-016.
      - name: Isolated E-016 latency budget
        run: npm run test:performance
      - name: Isolated TOK-12 ten-million-input collision proof
        run: npm run test:tokenization-collision
      - run: MIGRATION_DATABASE_URL="$TEST_DATABASE_URL" npm run migrate:down
      - run: MIGRATION_DATABASE_URL="$TEST_DATABASE_URL" npm run migrate:up
      - run: docker compose down -v
        if: always()

  ephemerality:
    name: Linux S4 ephemerality and S5 shipping controls (SD-005)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:ephemerality
      - name: Coverage and unsuppressed memory residual reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s4-ephemerality-reports
          path: test-results/ephemerality/**/*.json
          if-no-files-found: error
          retention-days: 7
